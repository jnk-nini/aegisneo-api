name: Checks

# Every push to master redeploys the sites on Vercel, so run each companion
# site's tests, lint and production build first to catch regressions.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  site:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [impactor, neo-atlas]
    defaults:
      run:
        working-directory: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.site }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
