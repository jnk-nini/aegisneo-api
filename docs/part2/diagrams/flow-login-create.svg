<svg xmlns='http://www.w3.org/2000/svg' width='980' height='1046' viewBox='0 0 980 1046'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5B7290'/></marker></defs><rect width='100%' height='100%' fill='#fff'/><line x1='110' y1='76' x2='110' y2='1040' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='30' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='110' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Client</text><text x='110' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>website, Swagger</text><line x1='290' y1='76' x2='290' y2='1040' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='210' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='290' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Routes</text><text x='290' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>api/index.py</text><line x1='470' y1='76' x2='470' y2='1040' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='390' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='470' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Access control</text><text x='470' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>api/auth.py</text><line x1='650' y1='76' x2='650' y2='1040' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='570' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='650' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Data access</text><text x='650' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>api/db.py</text><line x1='830' y1='76' x2='830' y2='1040' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='750' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='830' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Neon</text><text x='830' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>PostgreSQL</text><rect x='6' y='104' width='968' height='28' fill='#EEF3FA'/><text x='14' y='124' font-family='Carlito, Calibri, sans-serif' font-size='16.5' fill='#1F3864' font-weight='bold' text-anchor='start'>A. Log in</text><line x1='110' y1='172' x2='288' y2='172' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='118' y='164' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>1. POST /api/v1/auth/login</text><text x='118' y='191' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>username, password</text><line x1='290' y1='230' x2='648' y2='230' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='298' y='222' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>2. get_user_by_username()</text><line x1='650' y1='280' x2='828' y2='280' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='658' y='272' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>3. SELECT … FROM users</text><text x='658' y='299' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>WHERE username = %s</text><line x1='830' y1='338' x2='652' y2='338' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='658' y='330' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>4. one row or none</text><line x1='650' y1='388' x2='292' y2='388' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='298' y='380' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>5. user record with hash</text><line x1='290' y1='438' x2='468' y2='438' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='298' y='430' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>6. check password, sign JWT</text><text x='298' y='457' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>wrong password: 401</text><line x1='290' y1='496' x2='112' y2='496' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='118' y='488' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>7. 200 OK, access_token</text><rect x='6' y='538' width='968' height='28' fill='#EEF3FA'/><text x='14' y='558' font-family='Carlito, Calibri, sans-serif' font-size='16.5' fill='#1F3864' font-weight='bold' text-anchor='start'>B. Create a record</text><line x1='110' y1='606' x2='288' y2='606' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='118' y='598' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>8. POST /api/v1/asteroids</text><text x='118' y='625' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>Bearer token, JSON body</text><line x1='290' y1='664' x2='468' y2='664' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='298' y='656' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>9. verify token</text><text x='298' y='683' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>missing or invalid: 401</text><path d='M290,716 H326 V738 H294' fill='none' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='334' y='724' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>10. validate body</text><text x='334' y='744' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>invalid: 422</text><line x1='290' y1='786' x2='648' y2='786' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='298' y='778' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>11. create_asteroid(data, user)</text><line x1='650' y1='836' x2='828' y2='836' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='658' y='828' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>12. INSERT … RETURNING *</text><line x1='830' y1='886' x2='652' y2='886' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='658' y='878' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>13. row, or error 23505</text><line x1='650' y1='936' x2='292' y2='936' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='298' y='928' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>14. record, or duplicate error</text><line x1='290' y1='986' x2='112' y2='986' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='118' y='978' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>15. 201 Created, the record</text><text x='118' y='1005' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>duplicate: 409, database down: 503</text></svg>