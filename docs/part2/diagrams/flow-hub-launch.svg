<svg xmlns='http://www.w3.org/2000/svg' width='980' height='812' viewBox='0 0 980 812'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5B7290'/></marker></defs><rect width='100%' height='100%' fill='#fff'/><line x1='110' y1='76' x2='110' y2='806' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='30' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='110' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Visitor</text><text x='110' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>browser</text><line x1='290' y1='76' x2='290' y2='806' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='210' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='290' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Hub</text><text x='290' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>AegisNEO site</text><line x1='470' y1='76' x2='470' y2='806' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='390' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='470' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>API</text><text x='470' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>FastAPI</text><line x1='650' y1='76' x2='650' y2='806' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='570' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='650' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Partner site</text><text x='650' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>server function</text><line x1='830' y1='76' x2='830' y2='806' stroke='#b9c6d6' stroke-dasharray='4 4'/><rect x='750' y='16' width='160' height='60' rx='4' fill='#fff' stroke='#1F3864' stroke-width='1.4'/><text x='830' y='41.5' font-family='Carlito, Calibri, sans-serif' font-size='17.5' fill='#1F3864' font-weight='bold' text-anchor='middle'>Neon</text><text x='830' y='63.5' font-family='Carlito, Calibri, sans-serif' font-size='15.5' fill='#4f5866' text-anchor='middle'>PostgreSQL</text><rect x='6' y='104' width='968' height='28' fill='#EEF3FA'/><text x='14' y='124' font-family='Carlito, Calibri, sans-serif' font-size='16.5' fill='#1F3864' font-weight='bold' text-anchor='start'>A. Open a partner site from the hub</text><line x1='110' y1='172' x2='288' y2='172' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='118' y='164' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>1. click "Open Impactor"</text><line x1='290' y1='222' x2='468' y2='222' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='298' y='214' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>2. POST /sites/impactor/launch</text><text x='298' y='241' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>Bearer token (or none: guest)</text><line x1='470' y1='280' x2='828' y2='280' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='478' y='272' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>3. rule for (role, site); INSERT launch</text><text x='478' y='299' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>award badges</text><line x1='470' y1='338' x2='292' y2='338' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='298' y='330' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>4. url + ticket (aud = impactor)</text><text x='298' y='357' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>guest: no ticket</text><line x1='290' y1='396' x2='112' y2='396' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='118' y='388' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>5. redirect to url#aegis_ticket=...</text><text x='118' y='415' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>fragment: never sent to a server</text><rect x='6' y='446' width='968' height='28' fill='#EEF3FA'/><text x='14' y='466' font-family='Carlito, Calibri, sans-serif' font-size='16.5' fill='#1F3864' font-weight='bold' text-anchor='start'>B. The partner site asks for data</text><line x1='110' y1='514' x2='648' y2='514' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='118' y='506' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>6. GET /api/neo/asteroids</text><text x='118' y='533' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>header x-aegisneo-ticket</text><line x1='650' y1='572' x2='472' y2='572' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='478' y='564' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>7. GET /api/v1/asteroids</text><text x='478' y='591' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>x-api-key + Bearer ticket</text><path d='M470,624 H506 V646 H474' fill='none' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='514' y='632' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>8. ticket valid, aud = key owner?</text><text x='514' y='652' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>no: 401</text><line x1='470' y1='694' x2='828' y2='694' stroke='#5B7290' stroke-width='1.5' marker-end='url(#a)'/><text x='478' y='686' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>9. site_access row, then SELECT</text><text x='478' y='713' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>item_limit empty: all; 10: featured</text><line x1='470' y1='752' x2='112' y2='752' stroke='#5B7290' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='118' y='744' font-family='Carlito, Calibri, sans-serif' font-size='16' fill='#222' text-anchor='start'>10. 200 OK, access "full" or "limited"</text><text x='118' y='771' font-family='Carlito, Calibri, sans-serif' font-size='15' fill='#4f5866' text-anchor='start'>via the partner site</text></svg>